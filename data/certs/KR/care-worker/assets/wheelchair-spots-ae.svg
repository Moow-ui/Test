old" text-anchor="middle" font-family="sans-serif" fill="#111">D</text><g transform="rotate(0 30 115)"><rect x="8" y="95.0" width="44" height="40" rx="4" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="6 4"/></g><text x="30" y="122" font-size="20" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="#111">E</text><text x="210" y="365" font-size="13" text-anchor="middle" font-family="sans-serif" fill="#111">침대에 걸터앉은 대상자를 위에서 본 모습</text><text x="210" y="388" font-size="13" text-anchor="middle" font-family="sans-serif" fill="#111">점선 칸 = 휠체어를 놓을 수 있는 자리</text>
