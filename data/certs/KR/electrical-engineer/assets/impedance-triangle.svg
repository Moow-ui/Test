<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 335" width="480" height="335">
<g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round">
<polygon points="70,220 330,220 330,80" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="316,220 316,206 330,206" stroke-width="1.5"/>
<path d="M120,220 A50,50 0 0 0 114.0,196.3" stroke-width="1.5"/>
<text x="134" y="212" text-anchor="start" font-family="sans-serif" fill="#111" stroke="none" font-size="18">θ</text>
<text x="200" y="246" text-anchor="middle" font-family="sans-serif" fill="#111" stroke="none" font-size="16" font-weight="bold">R (저항)</text>
<text x="342" y="156" text-anchor="start" font-family="sans-serif" fill="#111" stroke="none" font-size="16" font-weight="bold">X (리액턴스)</text>
<text x="186" y="136" text-anchor="end" font-family="sans-serif" fill="#111" stroke="none" font-size="16" font-weight="bold">Z (임피던스)</text>
<text x="240" y="290" text-anchor="middle" font-family="sans-serif" fill="#111" stroke="none" font-size="17">Z = √(R² + X²)</text>
<text x="240" y="316" text-anchor="middle" font-family="sans-serif" fill="#111" stroke="none" font-size="17">역률 cosθ = R ÷ Z</text>
</g>
</svg>
