<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420"><rect width="100%" height="100%" fill="#fff"/><text x="30" y="34" font-family="sans-serif" font-size="19" fill="#111" text-anchor="start" font-weight="bold">IE(까마귀발) 표기: 엔터티(E) 쪽 선 끝 = 연결되는 E 의 개수</text><rect x="230" y="60" width="60" height="40" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="260" y="86" font-family="sans-serif" font-size="17" fill="#111" text-anchor="middle">E</text><line x1="60" y1="80" x2="230" y2="80" stroke="#111" stroke-width="2.5"/><line x1="220" y1="68" x2="220" y2="92" stroke="#111" stroke-width="2.5"/><line x1="210" y1="68" x2="210" y2="92" stroke="#111" stroke-width="2.5"/><text x="310" y="86" font-family="sans-serif" font-size="18" fill="#111" text-anchor="start">꼭 1개 (필수, 하나)</text><rect x="230" y="116" width="60" height="40" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="260" y="142" font-family="sans-serif" font-size="17" fill="#111" text-anchor="middle">E</text><line x1="60" y1="136" x2="230" y2="136" stroke="#111" stroke-width="2.5"/><line x1="220" y1="124" x2="220" y2="148" stroke="#111" stroke-width="2.5"/><circle cx="202" cy="136" r="7" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="310" y="142" font-family="sans-serif" font-size="18" fill="#111" text-anchor="start">0개 또는 1개 (선택, 하나)</text><rect x="230" y="172" width="60" height="40" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="260" y="198" font-family="sans-serif" font-size="17" fill="#111" text-anchor="middle">E</text><line x1="60" y1="192" x2="230" y2="192" stroke="#111" stroke-width="2.5"/><line x1="210" y1="192" x2="230" y2="179" stroke="#111" stroke-width="2.5"/><line x1="210" y1="192" x2="230" y2="192" stroke="#111" stroke-width="2.5"/><line x1="210" y1="192" x2="230" y2="205" stroke="#111" stroke-width="2.5"/><line x1="203" y1="180" x2="203" y2="204" stroke="#111" stroke-width="2.5"/><text x="310" y="198" font-family="sans-serif" font-size="18" fill="#111" text-anchor="start">1개 이상 (필수, 여럿)</text><rect x="230" y="228" width="60" height="40" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="260" y="254" font-family="sans-serif" font-size="17" fill="#111" text-anchor="middle">E</text><line x1="60" y1="248" x2="230" y2="248" stroke="#111" stroke-width="2.5"/><line x1="210" y1="248" x2="230" y2="235" stroke="#111" stroke-width="2.5"/><line x1="210" y1="248" x2="230" y2="248" stroke="#111" stroke-width="2.5"/><line x1="210" y1="248" x2="230" y2="261" stroke="#111" stroke-width="2.5"/><circle cx="198" cy="248" r="7" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="310" y="254" font-family="sans-serif" font-size="18" fill="#111" text-anchor="start">0개 이상 (선택, 여럿)</text><line x1="60" y1="314" x2="210" y2="314" stroke="#111" stroke-width="2.5"/><text x="230" y="320" font-family="sans-serif" font-size="17" fill="#111" text-anchor="start">실선 = 식별 관계 (부모 키가 자식 주식별자에 포함)</text><line x1="60" y1="358" x2="210" y2="358" stroke="#111" stroke-width="2.5" stroke-dasharray="10 7"/><text x="230" y="364" font-family="sans-serif" font-size="17" fill="#111" text-anchor="start">점선 = 비식별 관계 (부모 키가 자식 일반 속성)</text><text x="30" y="406" font-family="sans-serif" font-size="17" fill="#111" text-anchor="start">동그라미 = 0(선택), 세로선 = 1, 까마귀발 = 여럿</text></svg>
