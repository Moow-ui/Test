<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
<rect width="600" height="280" fill="#fff"/>
<polygon points="20,20 290,110 20,200" fill="#FFCD00" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
<polygon points="34,38 248,110 34,182" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
<text x="88" y="90" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111">NO</text>
<text x="88" y="115" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111">PASSING</text>
<text x="88" y="140" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111">ZONE</text>
<text x="150" y="222" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#111">Yellow pennant</text>
<text x="150" y="245" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#111">Left side of the road</text>
<text x="150" y="266" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#111">Start of a no-passing zone</text>
<rect x="380" y="20" width="140" height="180" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
<rect x="387" y="27" width="126" height="166" rx="5" fill="none" stroke="#111" stroke-width="4"/>
<text x="450" y="80" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#111">DO</text>
<text x="450" y="122" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#111">NOT</text>
<text x="450" y="164" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#111">PASS</text>
<text x="450" y="222" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#111">White rectangle</text>
<text x="450" y="245" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#111">Right side of the road</text>
<text x="450" y="266" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#111">The rule: do not pass</text>
</svg>
