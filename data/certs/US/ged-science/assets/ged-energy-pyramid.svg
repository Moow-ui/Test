<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="Energy pyramid"><rect x="0" y="0" width="560" height="400" fill="#ffffff"/><polygon points="180.0,30 380.0,30 422.5,110 137.5,110" fill="#fbe7d6" stroke="#111" stroke-width="2"/><text x="280" y="68.0" font-family="sans-serif" fill="#111" font-size="17" font-weight="bold" text-anchor="middle">Tertiary consumers</text><text x="280" y="88.0" font-family="sans-serif" fill="#111" font-size="17" text-anchor="middle">10 kcal</text><polygon points="137.5,110 422.5,110 465.0,190 95.0,190" fill="#fdf2c8" stroke="#111" stroke-width="2"/><text x="280" y="148.0" font-family="sans-serif" fill="#111" font-size="17" font-weight="bold" text-anchor="middle">Secondary consumers</text><text x="280" y="168.0" font-family="sans-serif" fill="#111" font-size="17" text-anchor="middle">100 kcal</text><polygon points="95.0,190 465.0,190 507.5,270 52.5,270" fill="#e3eefb" stroke="#111" stroke-width="2"/><text x="280" y="228.0" font-family="sans-serif" fill="#111" font-size="17" font-weight="bold" text-anchor="middle">Primary consumers</text><text x="280" y="248.0" font-family="sans-serif" fill="#111" font-size="17" text-anchor="middle">1,000 kcal</text><polygon points="52.5,270 507.5,270 550.0,350 10.0,350" fill="#e8f3e4" stroke="#111" stroke-width="2"/><text x="280" y="308.0" font-family="sans-serif" fill="#111" font-size="17" font-weight="bold" text-anchor="middle">Producers</text><text x="280" y="328.0" font-family="sans-serif" fill="#111" font-size="17" text-anchor="middle">10,000 kcal</text><text x="280" y="380" font-family="sans-serif" fill="#111" font-size="16" text-anchor="middle">About 10% of the energy passes up to each next level.</text></svg>