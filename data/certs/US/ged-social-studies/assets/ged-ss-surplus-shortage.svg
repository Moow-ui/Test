<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="Supply, demand, surplus, and shortage"><rect x="0" y="0" width="560" height="440" fill="#ffffff"/><line x1="80" y1="370" x2="460" y2="370" stroke="#111" stroke-width="2"/><line x1="80" y1="370" x2="80" y2="50" stroke="#111" stroke-width="2"/><text x="270" y="405" font-family="sans-serif" fill="#111" font-size="16" text-anchor="middle">Quantity</text><text x="40" y="210" font-family="sans-serif" fill="#111" font-size="16" text-anchor="middle" transform="rotate(-90 40 210)">Price</text><line x1="80" y1="360" x2="440" y2="80" stroke="#111" stroke-width="3"/><line x1="80" y1="80" x2="440" y2="360" stroke="#111" stroke-width="3"/><text x="448" y="86" font-family="sans-serif" fill="#111" font-size="18" font-weight="bold">Supply</text><text x="448" y="366" font-family="sans-serif" fill="#111" font-size="18" font-weight="bold">Demand</text><circle cx="260" cy="220" r="7" fill="#111"/><text x="276" y="226" font-family="sans-serif" fill="#111" font-size="15" font-weight="bold">Equilibrium</text><line x1="80" y1="150" x2="350" y2="150" stroke="#111" stroke-width="2" stroke-dasharray="8 5"/><line x1="170" y1="150" x2="350" y2="150" stroke="#111" stroke-width="6"/><text x="260" y="138" font-family="sans-serif" fill="#111" font-size="15" text-anchor="middle">Surplus (price too high)</text><line x1="80" y1="290" x2="350" y2="290" stroke="#111" stroke-width="2" stroke-dasharray="8 5"/><line x1="170" y1="290" x2="350" y2="290" stroke="#111" stroke-width="6"/><text x="260" y="314" font-family="sans-serif" fill="#111" font-size="15" text-anchor="middle">Shortage (price too low)</text></svg>