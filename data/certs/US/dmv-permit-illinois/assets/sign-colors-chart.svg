<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
<rect width="800" height="460" fill="#fff"/>
<rect x="30" y="20" width="140" height="90" rx="8" fill="#C8102E" stroke="#111" stroke-width="3"/>
<text x="100" y="145" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111">Red</text>
<text x="100" y="172" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">Stop, yield,</text>
<text x="100" y="196" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">do not enter</text>
<rect x="230" y="20" width="140" height="90" rx="8" fill="#FFCD00" stroke="#111" stroke-width="3"/>
<text x="300" y="145" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111">Yellow</text>
<text x="300" y="172" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">Warning of a</text>
<text x="300" y="196" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">hazard ahead</text>
<rect x="430" y="20" width="140" height="90" rx="8" fill="#FF7F00" stroke="#111" stroke-width="3"/>
<text x="500" y="145" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111">Orange</text>
<text x="500" y="172" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">Road work</text>
<text x="500" y="196" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">zone</text>
<rect x="630" y="20" width="140" height="90" rx="8" fill="#C5E41C" stroke="#111" stroke-width="3"/>
<text x="700" y="145" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111">Yellow-green</text>
<text x="700" y="172" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">School, people</text>
<text x="700" y="196" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">walking, bikes</text>
<rect x="30" y="245" width="140" height="90" rx="8" fill="#FFFFFF" stroke="#111" stroke-width="3"/>
<text x="100" y="370" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111">White</text>
<text x="100" y="397" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">Rule you</text>
<text x="100" y="421" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">must obey</text>
<rect x="230" y="245" width="140" height="90" rx="8" fill="#00843D" stroke="#111" stroke-width="3"/>
<text x="300" y="370" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111">Green</text>
<text x="300" y="397" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">Directions and</text>
<text x="300" y="421" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">distances</text>
<rect x="430" y="245" width="140" height="90" rx="8" fill="#0057B8" stroke="#111" stroke-width="3"/>
<text x="500" y="370" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111">Blue</text>
<text x="500" y="397" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">Services such</text>
<text x="500" y="421" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">as gas or food</text>
<rect x="630" y="245" width="140" height="90" rx="8" fill="#7A4A1E" stroke="#111" stroke-width="3"/>
<text x="700" y="370" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111">Brown</text>
<text x="700" y="397" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">Parks and</text>
<text x="700" y="421" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">recreation</text>
